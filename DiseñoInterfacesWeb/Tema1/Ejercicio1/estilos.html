<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Que todas las transiciones se hagan en 1s */
        *{
            transition: all 1s;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: wrap;
            
        }
        div{
            width: 200px;
            height: 200px;
            background-color: salmon;
            border: solid 10px white;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            font-size: 5rem;
            color:  white;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-shadow: 0 0 10px black;
            overflow: hidden;
        }
        div::before{
            content: "+";
            position: relative;
            top: 100%;
        }
        #c1{
            background: url("https://picsum.photos/400") center center no-repeat;
        }
        #c1:hover{
            background-position: 50% 0%;
        }
        div:hover::before{
            top: 0%;
        }
        div:nth-child(2){
            font-size: 1.5rem;
            p{
                position: relative;
                top: 80%;
            }
            &:hover p{
                top: 0%;
            }
        }
        div:nth-child(3):hover{
            transform: scale(1.4, 1.3);
        }

        
    </style>
</head>
<body>
    <!-- #c$*9 -->
    
    <div id="c1"></div>
    <div id="c2"><p>evsxdfvfcv</p></div>
    <div id="c3"></div>
    <div id="c4"></div>
    <div id="c5"></div>
    <div id="c6"></div>
    <div id="c7"></div>
    <div id="c8"></div>
    <div id="c9"></div>

</body>
</html>

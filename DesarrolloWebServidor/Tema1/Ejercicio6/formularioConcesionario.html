<!DOCTYPE html>
<html lang="es">
    <head><meta charset="UTF-8"><title>Concesionario</title></head>
    <body>
        <h1>Configura tu coche</h1>
        <form action="procesarConcesionario.php" method="POST">
            <fieldset>
                <legend>Modelo (obligatorio)</legend>
                <label><input type="radio" name="Modelo[]" value="Compacto"
                        required> Compacto</label>
                <!-- TODO: añade Sedán y SUV con el mismo name. -->
                <label><input type="radio" name="Modelo[]" value="Sedan"
                        required> Sedan</label>
                <label><input type="radio" name="Modelo[]" value="SUV"
                        required> SUV</label>
            </fieldset>

            <!-- TODO: añade fieldsets con radios para Motor, Color, Llantas y Equipamiento. -->
            <fieldset>
                <legend>Motor</legend>
                <label for="motor">Gasolina 1.6L</label>
                <input type="radio" name="motor" value="Gasolina 1.6L" />
                <label for="motor">Diesel 2.0L</label>
                <input type="radio" name="motor" value="Diesel 2.0L" />
                <label for="motor">Eléctrico 75 kWh</label>
                <input type="radio" name="motor" value="Eléctrico 75 kWh" />
            </fieldset>
                <br>
                <!-- TODO: añade un fieldset de checkboxes name="Accesorios[]" con los ocho accesorios. -->
                <fieldset>
                    <legend>Color</legend>
                    <label for="color">Blanco</label>
                    <input type="radio" name="color" value="Blanco" />
                    <label for="color">Negro</label>
                    <input type="radio" name="color" value="Negro" />
                    <label for="color">Azul Metálico</label>
                    <input type="radio" name="color" value="Azul Metálico" />
                    <label for="color">Rojo</label>
                    <input type="radio" name="color" value="Rojo" />
                </fieldset>
                    <br>
                <fieldset>
                    <legend>Llantas</legend>
                    <label for="llantas">Aleación 16</label>
                    <input type="radio" name="llantas" value= '"16" Aleación'  />
                    
                    <label for="llantas">Aleación 18</label>
                    <input type="radio" name="llantas" value='"18" Aleación' />
                    
                    <label for="llantas">Deportivo 20</label>
                    <input type="radio" name="llantas" value='"20" Deportivo' />
                    
                </fieldset>
                    <br>
                <fieldset>
                    <legend>Equipamiento</legend>
                    <label for="equipamiento">Basico</label>
                    <input type="radio" name="equipamiento" value= "Básico"  />
                    <label for="equipamiento">Confort</label>
                    <input type="radio" name="equipamiento" value= "Confort"  />
                    <label for="equipamiento">Aleación 16</label>
                    <input type="radio" name="equipamiento" value= "Premium"  />
                </fieldset>
                    <br>
                    <fieldset>
                        <legend>Accesorios</legend>
                        <label><input type="checkbox" name="accesorios[]" value="Techo Panorámico"> Techo Panorámico</label>
                        <label><input type="checkbox" name="accesorios[]" value="Asientos de Cuero"> Asientos de Cuero</label>
                        <label><input type="checkbox" name="accesorios[]" value="Cámara de 360°"> Cámara de 360°</label>
                        <label><input type="checkbox" name="accesorios[]" value="Paquete Deportivo"> Paquete Deportivo</label>
                        <label><input type="checkbox" name="accesorios[]" value="Control de Crucero Adaptativo"> Control de Crucero Adaptativo</label>
                        <label><input type="checkbox" name="accesorios[]" value="Sensores de Aparcamiento"> Sensores de Aparcamiento</label>
                        <label><input type="checkbox" name="accesorios[]" value="Maletero Eléctrico"> Maletero Eléctrico</label>
                    </fieldset>
                        <br>
                    <label>Cantidad (1–5): <input type="number" name="cantidad" min="1"
                    max="5" value="1" required></label>
                    <br>
            <!-- TODO: añade el campo opcional de texto name="codigo_descuento". -->
            <label for="codigo_descuento">Codigo Descuento</label>
            <input type="text" id="codigo_descuento" name="codigo_descuento" maxlength="20"/>
            <br><button type="submit">Calcular precio</button>
        </form>
    </body>
</html>

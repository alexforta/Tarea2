<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Escrutinio simulado</title>
</head>
<body>
    <h1>Escrutinio municipal ficticio</h1>
    <p>Introduce un recuento inventado. No son resultados oficiales.</p>
    
    <form method="post" action="procesarEscrutinio.php">
        <p>
            <label>Censo: <input type="number" name="censo" min="1" max="100000" required></label>
        </p>

        <fieldset>
            <legend>Votos a candidaturas</legend>
            <p><label>PSOE: <input type="number" name="votos[PSOE]" min="0" value="0" required></label></p>
            <!-- TODO: campos PP, Vox, Sumar y Podemos con name="votos[PARTIDO]" -->
            <p><label>PP: <input type="number" name="votos[PP]" min="0" value="0" required></label></p>
            <p><label>Vox: <input type="number" name="votos[Vox]" min="0" value="0" required></label></p>
            <p><label>Sumar: <input type="number" name="votos[Sumar]" min="0" value="0" required></label></p>
            <p><label>Podemos: <input type="number" name="votos[Podemos]" min="0" value="0" required></label></p>
        </fieldset>

        <fieldset>
            <legend>Otros votos</legend>
            <!-- TODO: campos name="blancos" y name="nulos", enteros >= 0 -->
            <p><label>Votos en blanco: <input type="number" name="blancos" min="0" value="0" required></label></p>
            <p><label>Votos nulos: <input type="number" name="nulos" min="0" value="0" required></label></p>
        </fieldset>

        <p>
            <button type="submit">Calcular escrutinio</button>
        </p>
    </form>
</body>
</html>

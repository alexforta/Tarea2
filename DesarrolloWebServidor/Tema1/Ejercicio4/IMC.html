<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
</head>

<body>
    <h1>Calculadora de IMC</h1>
    <form action="porcesarIMC.php" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre" maxlength="100" required>
        <br>
        <label for="edad">Edad</label>
        <input type="number" name="edad" id="edad" min="0" max="130" required>

        <!-- TODO: añade altura en cm, como entero entre 50 y 300, name="altura". -->
        <br>
        <label for="altura">Altura cm</label>
        <input name="altura" id="altura" type="number" min="50" max="300" step="0.1">
        <!-- TODO: añade peso en kg, admitiendo decimales entre 20 y 500, name="peso". -->
        <br>
        <label for="peso">Peso</label>
        <input type="number" name="peso" id="peso" min="20" max="500" step="0.1">
        <!-- TODO: añade el botón de envío. -->
        <button type="submit">Enviar formulario</button>
    </form>
</body>

</html>

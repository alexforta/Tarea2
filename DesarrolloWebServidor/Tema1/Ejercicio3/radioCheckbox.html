<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Datos personales</title>
</head>

<body>
    <h1>Datos personales</h1>
    <form action="porcesarDatos.php" method="POST">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="20" required />
        <br />
        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos" maxlength="20" required />
        <br />
        <!-- TODO: crea un select name="edad" con los cuatro intervalos del enunciado. -->
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" />
        <br />
        <!-- TODO: crea el campo numérico name="peso" que admita decimales. -->
        <br>
        <label for="peso">Peso kg</label>
        <input name="peso" id="peso" type="number" min="20" max="500" step="0.1">
        <!-- TODO: crea los radios name="sexo" (masculino/femenino). -->
        <label for="masculino">Masculino</label>
        <input type="radio" name="sexo" value="masculino" />
        <label for="femenino">Femenino</label>
        <input type="radio" name="sexo" value="femenino" />
        <br />

        <!-- TODO: crea los radios name="estado-civil" (soltero/casado/otro). -->
        <label for="soltero">soltero</label>
        <input type="radio" name="estado-civil" value="soltero" />

        <label for="casado">casado</label>
        <input type="radio" name="estado-civil" value="casado" />

        <label for="otro">otro</label>
        <input type="radio" name="estado-civil" value="otro" />
        <br />
        <!-- TODO: crea los checkboxes name="aficiones[]" con los valores pedidos. -->
        <label for="cine">cine</label>
        <input type="checkbox" name="aficiones" value="cine" />
        <br />
        <label for="literatura">literatura</label>
        <input type="checkbox" name="aficiones" value="literatura" />
        <br />
        <label for="tebeos">tebeos</label>
        <input type="checkbox" name="aficiones" value="tebeos" />
        <br />
        <label for="literatura">deporte</label>
        <input type="checkbox" name="deporte" value="deporte" />
        <br />
        <label for="literatura">musica</label>
        <input type="checkbox" name="musica" value="musica" />
        <br />
        <label for="literatura">television</label>
        <input type="checkbox" name="television" value="television" />
        <br />
        <!-- TODO: añade los botones Enviar y Borrar. -->
        <button type="submit">Enviar formulario</button>
        <button type="reset">Borrar</button>
    </form>
</body>

</html>
